name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Linux Kconfig syntax keeps evolving (modules, transitional, depends-on-if
    # all postdate Kconfiglib 14.1.0). Catch the next new keyword early.
    - cron: "17 6 * * 1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Extra Python versions run on ubuntu only - there's no OS-specific
        # Python code, so the full cross product would just burn minutes.
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "ruff==0.16.0" "mypy==2.3.0" ".[test]"
      - run: ruff check src tests
      - run: mypy --strict src
      - run: pytest tests -v --ignore=tests/test_linux_integration.py

  linux-kconfig:
    # Parse the real, current Linux tree. A sparse, blobless clone of just the
    # Kconfig files and x86 defconfigs is ~30 MB instead of several GB.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sparse checkout of torvalds/linux (Kconfig files only)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/torvalds/linux.git linux
          cd linux
          git sparse-checkout set --no-cone '/Kconfig' '**/Kconfig*' '/arch/x86/configs/*'
      - run: pip install ".[test]"
      - run: pytest tests/test_linux_integration.py -v
        env:
          LINUX_SRC: ${{ github.workspace }}/linux
